spring.application.name=studyplanner
spring.config.import=optional:file:./config/google-calendar.properties,optional:file:./backend/config/google-calendar.properties
spring.profiles.default=postgres
server.address=127.0.0.1
server.port=8080
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

google.calendar.client-id=${GOOGLE_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
google.calendar.encryption-key=${GOOGLE_TOKEN_KEY:}
google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI:http://127.0.0.1:5173/api/google-calendar/callback}
google.calendar.frontend-url=${APP_FRONTEND_URL:http://127.0.0.1:5173/}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.legacy-claim-token=${LEGACY_CLAIM_TOKEN:}
server.servlet.session.timeout=8h
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
